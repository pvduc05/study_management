name: study_docs
description: StudyDocs - local learning document manager built with Drift and SQLite.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.30.0
  sqlite3_flutter_libs: ^0.5.39
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  file_picker: ^10.3.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.30.0
  build_runner: ^2.10.1
  sqlite3: ^3.5.2

flutter:
  uses-material-design: true
